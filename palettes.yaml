# Palette definitions for Mandelbrot/Julia renderer.
# All palettes are gradient-based RGB palettes loaded at startup.
#
# Gradient palette format:
#   type: gradient   — multi-stop RGB gradient.
#                      stops: list of [position, r, g, b] where position in [0,1]
#                      and r/g/b in [0, 255] (converted to 0-1 internally).
#
# Palette ordering determines cycling order (Tab / cycle-palette).

palettes:
  # ── Gradient palettes ─────────────────────────────────────────────────
  - name: fire-gradient
    type: gradient
    stops:
      - [0.00, 230,   0,   0]
      - [0.25, 255, 100,   0]
      - [0.50, 255, 180,   0]
      - [0.75, 255, 240, 100]
      - [1.00, 255, 255, 255]

  - name: deep-sea-gradient
    type: gradient
    stops:
      - [0.00,   0,  30,  80]
      - [0.50,   0, 120, 180]
      - [1.00, 100, 200, 255]

  - name: twilight-gradient
    type: gradient
    stops:
      - [0.00,  10,   0,  40]
      - [0.50,  60,  20, 120]
      - [1.00, 200, 150, 240]

  - name: aurora-gradient
    type: gradient
    stops:
      - [0.00,    0,  60,  30]
      - [0.40,    0, 200,  80]
      - [0.70,  180,  60, 200]
      - [1.00,  100, 200, 255]

  - name: forest-gradient
    type: gradient
    stops:
      - [0.00,  20,  80,  20]
      - [0.40,  60, 160,  40]
      - [0.70, 120, 200,  60]
      - [1.00, 220, 240, 200]

  - name: sunset-gradient
    type: gradient
    stops:
      - [0.00,  80,   0,  20]
      - [0.30, 200,  60,  40]
      - [0.60, 255, 120,  30]
      - [1.00, 255, 200, 180]

  - name: amber-gradient
    type: gradient
    stops:
      - [0.00, 255, 100,   0]
      - [0.50, 255, 180,  30]
      - [1.00, 255, 255, 180]

  - name: copper-gradient
    type: gradient
    stops:
      - [0.00,  80,  40,  20]
      - [0.50, 180, 100,  50]
      - [1.00, 255, 190, 120]

  - name: electric-gradient
    type: gradient
    stops:
      - [0.00, 255,   0,   0]
      - [0.50, 255,  80,   0]
      - [1.00, 255, 200,   0]

  - name: lava-gradient
    type: gradient
    stops:
      - [0.00,  40,   0,  10]
      - [0.50, 220,  60,   0]
      - [0.80, 255, 140,   0]
      - [1.00, 255, 220,  80]

  - name: teal-gradient
    type: gradient
    stops:
      - [0.00,   0,  60, 100]
      - [0.50,   0, 180, 180]
      - [1.00, 180, 240, 255]
